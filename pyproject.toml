[project]
name = "agentic-fuzz-engine"
version = "0.1.0"
description = "Agentic local fuzzing runtime and CLI with dependency-gated backend adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/allsmog/agentic-fuzz-engine"
Repository = "https://github.com/allsmog/agentic-fuzz-engine"
Issues = "https://github.com/allsmog/agentic-fuzz-engine/issues"

[project.optional-dependencies]
claude = [
  "claude-agent-sdk>=0.1.0",
  "mcp>=1.28.1,<2.0.0",
  "cryptography>=50.0.0",
]
runtime = [
  "pyzmq>=27.0.0",
  "tree-sitter>=0.25.0",
  "tree-sitter-cpp>=0.23.0",
  "z3-solver>=4.15.0",
]
test = ["pytest>=8.0.0"]

[project.scripts]
agentic-fuzz-engine = "agentic_fuzz_engine.cli:main"
agentic-fuzz-engine-mcp = "agentic_fuzz_engine.mcp_stdio:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools/dispatcher"]
testpaths = ["tests"]
